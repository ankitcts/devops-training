name: new role
hosts: localhost
tasks:
  - name: create a new IAM role
    amazon.aws.iam_role:
      name: my-new-role
      assume_role_policy_document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ec2.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
        